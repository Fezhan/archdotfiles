monitor=desc:Philips Consumer Electronics Company PHL 243S5L UK01905026932,1920x1080@60,-1920x-1080,1
monitor=desc:Philips Consumer Electronics Company PHL 243S5L UK01905026931,1920x1080@60,0x-1080,1
