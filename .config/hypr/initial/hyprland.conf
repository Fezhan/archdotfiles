# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch
exec-once = swww-daemon
exec-once = waybar
exec-once = nm-applet
exec-once = blueman-applet
exec-once = hypridle
exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent
exec-once = hyprpm reload
# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Set programs that you use
$terminal = ghostty
$fileManager = thunar
$menu = ~/.config/rofi/launchers/type-1/./launcher.sh

xwayland {
  enabled = true
}

# Some default env vars.
env = BreezeX-Dark,24
env = QT_QPA_PLATFORMTHEME,qt6ct # change to qt6ct if you have that

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/

ecosystem {
    no_update_news = true
}

input {
    kb_layout = us, gb
    kb_variant =
    kb_model =
    kb_options = grp:alt_shift_toggle
    kb_rules =
    repeat_rate = 35
    repeat_delay = 300 
    follow_mouse = 1

    touchpad {
        natural_scroll = true

    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

cursor {
    inactive_timeout = 30
    hide_on_key_press = true
    hide_on_touch = true
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 7
    gaps_out = 15
    border_size = 2
    col.active_border = rgba(f52891cc) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(257566cc)
    layout = dwindle

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
    
    snap {
	enabled = true	 
	 }
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    # inactive_opacity = 0.9
    rounding = 10

    active_opacity = 1.0
    inactive_opacity = 0.9

    blur {
        enabled = true
        size = 15
        passes = 2
        new_optimizations = true
        #noise = 0.5
        popups = true
        
        vibrancy = 0.5
        vibrancy_darkness = 0.1
    }

    shadow {
        enabled = true
        range = 12
        render_power = 5
        color = rgba(1a1a1aee)

    }

   # drop_shadow = true
   # shadow_range = 4
    #shadow_render_power = 3
   # col.shadow = rgba(1a1a1aee)
}

animations {
    enabled = true

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    # new_is_master = true
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    gesture = 3, horizontal, workspace
}

misc {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true
    disable_hyprland_logo = true
    disable_splash_rendering = false
    allow_session_lock_restore = true
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
#device {
  #  name = epic-mouse-v1
 #   sensitivity = -0.5
#}

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
#windowrulev2 = suppressevent maximize, class:.* # You'll probably like this.

#windowrulev2 = float,class:^(microsoft-edge-stable)$



# ueberzugpp (ranger image previews)


# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Hyprswitch variables
$key = TAB
$switch_release = SUPER-L

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more

# Window rules to make Rofi windows float and center automatically
#windowrulev2 = float, title:^(rofi)$

#windowrule = float, title:^(Pidgin)$
#windowrule = float, title:^(Authorize)$



bind = $mainMod, T, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, fullscreen
bind = $mainMod, J, togglefloating,
bind = $mainMod, A, exec, $menu & togglefloating
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, O, togglesplit, # dwindle
bind = $mainMod, RETURN, exec, firefox -p
bind = $mainMod, C, exec, code
bind = $mainMod, BACKSPACE, exec, bash ~/.config/eww/launch_dashboard
bind = $mainMod SHIFT, A, exec, hyprctl kill
bind = $mainMod SHIFT, S, exec, hyprshot -m region -s 4
bind = $mainMod, R, exec, ~/.config/waybar/waybar.sh

bind = $mainMod, L, exec, hyprlock
#bind = $mainMod, L, exec, bash ~/.config/hypr/bakalock.sh

#Change wallpaper
bind = $mainMod, K, exec, bash ~/.config/swww/random_wallpaper
bind = $mainMod SHIFT, K, exec, bash ~/.config/swww/cycle_wallpaper


# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d


# move windows with arrow keys
bind = $mainMod CTRL, left, movewindow, l
bind = $mainMod CTRL, right, movewindow, r
bind = $mainMod CTRL, down, movewindow, d
bind = $mainMod CTRL, up, movewindow, u

# Brightness controls
bind=,XF86MonBrightnessDown,exec,brightnessctl set 5%-.
bind=,XF86MonBrightnessUp,exec,brightnessctl set +5%.


# Volume Controls
bind = ,XF86AudioLowerVolume, exec, pamixer --decrease 5
bind = ,XF86AudioRaiseVolume, exec, pamixer --increase 5
bind = ,XF86AudioMute, exec, pamixer --toggle-mute
bind = ,XF86Launch6, exec, pamixer --default-source -t


bind = ,XF86AudioPlay, exec, playerctl play-pause
bind = ,XF86AudioNext, exec, playerctl next
bind = ,XF86AudioPrev, exec, playerctl previous

bind = ,XF86Presentation, exec, /opt/damx/gui/DivAcerManagerMax

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
#bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

plugin:dynamic-cursors {
	enabled = true
	mode = tilt
	threshold = 2
	
	tilt {
		limit = 5000
		function = negative_quadratic
		window = 100
		full_tilt = 60
			
}
}

exec-once = dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP


env = HYPRCURSOR_THEME,BreezeX-Dark
env = HYPRCURSOR_SIZE,24
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,BreezeX-Dark


