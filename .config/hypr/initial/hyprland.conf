monitor=desc:HP Inc. HP 524pf CNK4430D85,1920x1080@60,-1920x0,1
monitor=desc:HP Inc. HP E243m 3CQ1180GCT,1920x1080@60,-1920x-1080,1
monitor=desc:HP Inc. HP E243m 3CQ11811DB,1920x1080@60,0x-1080,1
monitor=desc:HP Inc. HP E24 G5 CN442316MX,1920x1080@60,-1920x0,1
monitor=desc:HP Inc. HP E24 G5 CN442316MX,1920x1080@60,-3840x0,1
monitor=desc:HP Inc. HP E24 G5 CN44242FFP,1920x1080@60,-1920x0,1
monitor=desc:RGB Systems Inc. dba Extron Electronics ExtronScalerD,1920x1080@60,1920x0,1
