$hypr = ~/.config/hypr/initial/
$conf = $hypr/configs

# configs
source = $conf/monitors.conf
source = $conf/env.conf
source = $conf/input.conf
source = $conf/cursor.conf
source = $conf/general.conf
source = $conf/decoration.conf
source = $conf/animations.conf
source = $conf/gestures.conf
source = $conf/misc.conf
source = $conf/keybinds.conf
source = $conf/execs.conf
source = $conf/plugins.conf

$terminal = ghostty
$fileManager = thunar
$menu = ~/.config/rofi/launchers/type-1/./launcher.sh

xwayland {
  enabled = true
}

ecosystem {
    no_update_news = true
}


